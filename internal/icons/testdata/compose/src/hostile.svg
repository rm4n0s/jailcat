  <rect width="100" height="100" fill="url(#ok)" onclick="alert(2)" ONMOUSEOVER="alert(3)" class="a"/>
  <rect x="10" y="10" width="30" height="30" fill="url(http://evil.example/x.svg#a)"/>
  <rect x="50" y="10" width="30" height="30" style="fill:url(file:///etc/passwd); stroke:#e53935; stroke-width:3"/>
  <rect x="10" y="50" width="30" height="30" style="fill:url('#ok'); stroke:url(//evil.example/s.svg#b)"/>
  <rect x="50" y="50" width="30" height="30" fill="red" style="fill:\75rl(http://evil.example/e.svg)"/>
  <image x="0" y="0" width="20" height="20" xlink:href="file:///etc/passwd"/>
  <image x="20" y="0" width="20" height="20" href="http://evil.example/p.png"/>
  <image x="40" y="0" width="1" height="1" xlink:href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=="/>
  <image x="60" y="0" width="20" height="20" xlink:href="data:text/html;base64,PHNjcmlwdD5hbGVydCgxKTwvc2NyaXB0Pg=="/>
  <a xlink:href="javascript:alert(4)"><circle cx="90" cy="90" r="8" fill="#ffc107"/></a>
  <use xlink:href="http://evil.example/o.svg#icon"/>
  <animate attributeName="x" href="#ok" from="0" to="10"/>
